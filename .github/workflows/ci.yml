name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: The image builds and starts
        run: |
          docker build -t plugin .
          docker run -d --name plugin -p 8080:8080 plugin
          for i in $(seq 30); do curl -fs http://localhost:8080/v1/manifest && exit 0; sleep 1; done
          docker logs plugin
          exit 1
