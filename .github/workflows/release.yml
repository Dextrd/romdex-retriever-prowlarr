name: Release

# Pushing a tag such as v1.0.0 publishes that release: the image to the GitHub Container Registry, for amd64 and
# arm64, tagged 1.0.0, 1.0, 1 and latest; then a GitHub release with the changelog's notes for it.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag, the plugin's version and the changelog agree
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          plugin=$(grep -oP '(?<=^VERSION = ")[^"]+' app/main.py)
          if [ "$plugin" != "$version" ]; then echo "app/main.py says $plugin, the tag says $version"; exit 1; fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then echo "CHANGELOG.md has no section for [$version]"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Image names are lowercase, whatever the organisation's name looks like.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.version.outputs.owner }}/${{ github.event.repository.name }}
          # latest only for releases, not pre-releases such as 1.1.0-beta.1.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish the release with the changelog's notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          flags=""
          case "$VERSION" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "${{ github.event.repository.name }} $VERSION" --notes-file notes.md --verify-tag $flags
